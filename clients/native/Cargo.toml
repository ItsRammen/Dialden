[package]
name = "dialden-native"
version = "0.1.11"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Remote-first native channel browser for Dialden"

[dependencies]
sdl2 = "0.38"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"

[features]
default = []
# Desktop reference decoder; the webOS hardware-plane adapter is separate.
desktop-player = []

# LG native HLS playback and hardware video plane.
webos = []
