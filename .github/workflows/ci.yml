name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: make install

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      # The TV client ships as an ipk, so build it here rather than only on a
      # tag: a client that stopped packaging should fail the pull request that
      # broke it, not the release three weeks later.
      - name: Package webOS client
        run: npx --yes --package @webos-tools/cli@3.2.5 ares-package -o dist/webos clients/webos

      - name: Upload webOS package
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist/webos/*.ipk
          if-no-files-found: error
