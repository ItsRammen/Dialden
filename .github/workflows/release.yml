name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install

      - name: Bump version to tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "$VERSION" > website/version.txt
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      - name: Package Release
        run: |
          # Use our standard packing script
          chmod +x scripts/pack.sh
          ./scripts/pack.sh
          
          # Move artifacts to release folder for upload
          mkdir -p release
          mv dist/*.tar.gz release/

      # Versioned from clients/webos/appinfo.json, which the TV client
      # maintains on its own cadence: it is sideloaded by hand, so it does
      # not have to move whenever the server does.
      - name: Package webOS client
        run: |
          npx --yes --package @webos-tools/cli@3.2.5 ares-package -o dist/webos clients/webos
          cp dist/webos/*.ipk release/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/toasttv-*.tar.gz
            release/media.tar.gz
            release/*.ipk
          generate_release_notes: true

      - name: Update version files for auto-update
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git fetch origin main
          git checkout -f main
          echo "$VERSION" > website/version.txt
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/version.txt package.json
          git diff --cached --quiet || git commit -m "chore: bump version to $VERSION"
          git push origin main

      - name: Trigger Pages deploy
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
