services:
  toasttv:
    # Optional native-Linux override for Intel Quick Sync. The entrypoint adds
    # the mapped node's numeric group while dropping privileges. This is not
    # supported by Docker Desktop on Windows/WSL.
    devices:
      - "${TOASTTV_QSV_DEVICE:-/dev/dri/renderD128}:${TOASTTV_QSV_DEVICE:-/dev/dri/renderD128}"
